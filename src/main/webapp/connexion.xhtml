<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Connexion - Gestion de Projet</title>
    <h:outputStylesheet name="css/style.css" /> </h:head>
<h:body>
    <h2>Connexion</h2>
    <h:form id="loginForm">
        <h:messages globalOnly="true" style="color:red;" />

        <h:panelGrid columns="3">
            <h:outputLabel for="email" value="Email :" />
            <h:inputText id="email" value="#{authBean.email}" 
                         required="true" requiredMessage="L'email est obligatoire.">
                <f:validateRegex pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$" />
            </h:inputText>
            <h:message for="email" style="color:red;" />

            <h:outputLabel for="password" value="Mot de passe :" />
            <h:inputSecret id="password" value="#{authBean.password}" 
                           required="true" requiredMessage="Le mot de passe est obligatoire." />
            <h:message for="password" style="color:red;" />
        </h:panelGrid>

        <h:commandButton value="Se connecter" action="#{authBean.login}" />
    </h:form>
    <p>Pas encore inscrit ? <h:link outcome="inscription" value="Créer un compte" /></p>
</h:body>
</html>
